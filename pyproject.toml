[tool.poetry]
name = "andersan-api"
version = "0.1.0"
description = ""
authors = ["vitroid <vitroid@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
uvicorn = "^0.34.0"
fastapi = "^0.115.8"
geopy = "^2.4.1"
icecream = "^2.1.4"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1.1"
lxml = "^5.3.0"
matplotlib = "^3.10.0"
folium = "^0.19.4"
pandas = "^2.2.3"
scipy = "^1.15.2"
retry-requests = "^2.0.0"
delaunayextrapolation = "^0.3"
pyarrow = "^19.0.1"
tqdm = "^4.67.1"


[tool.poetry.group.debug.dependencies]
keras = "^3.10.0"
tensorflow = "^2.19.0"
airpollutionwatch = "^0.1.5"
sqlitedict = "^2.1.0"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
profile = "black"

[[tool.poetry.source]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
